name: Validate Release Automation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run PowerShell tests
        shell: pwsh
        run: ./tests/Test-DependencyCascade.ps1
